name: 🐛 Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Log in as amit@crm.local
        2. Open Leads → Pipeline
        3. Drag a card to "Won"
        4. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or error messages
      description: Paste terminal output, browser console errors or screenshots.
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Windows 11, Chrome 129, Python 3.12, Node 22"
