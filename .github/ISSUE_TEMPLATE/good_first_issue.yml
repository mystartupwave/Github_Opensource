name: 🌱 Good first issue (maintainers)
description: A small, well-scoped task for new contributors
labels: ["good first issue"]
body:
  - type: dropdown
    id: level
    attributes:
      label: Difficulty
      options:
        - "🟢 Easy"
        - "🟡 Medium"
        - "🔴 Hard"
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What needs to be done, and why.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files to look at
      placeholder: "- frontend/src/app/(app)/users/page.tsx"
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Acceptance criteria that a reviewer will check.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        **Want to work on this?** Comment below and wait to be assigned, then follow [CONTRIBUTING.md](https://github.com/mystartupwave/Github_Opensource/blob/master/CONTRIBUTING.md).
