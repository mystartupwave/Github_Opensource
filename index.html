.qo:hover:not(:disabled){border-color:var(--ac2)}.qo:disabled{cursor:default}.qo.ok{background:color-mix(in srgb,var(--ok) 18%,var(--card));border-color:var(--ok)}.qo.no{background:color-mix(in srgb,#e5484d 18%,var(--card));border-color:#e5484d}

{id:'m1',n:'1',t:'Foundations',at:'0:05',s:'Understand what version control solves, and why Git and GitHub dominate modern software teams.',b:[
{k:'cards',h:'What Is Version Control?',p:'A Version Control System (VCS) tracks changes to files over time, so you can recall specific versions, see who changed what, and collaborate without overwriting each other\'s work.',c:[C('Local','A database on one machine tracks file changes. Simple, but no collaboration and easy to lose (e.g. RCS).'),C('Centralized','One central server holds history; everyone checks out from it. Single point of failure (e.g. SVN, CVS).'),C('Distributed ✓','Every clone is a full backup with complete history. Fast, offline-capable, resilient — this is Git.')]},
{k:'two',h:'Installing & Configuring Git',c:[['Install',['Windows: download the installer from git-scm.com (includes Git Bash)','macOS: `xcode-select --install`, or `brew install git`','Linux: `sudo apt install git` / `sudo dnf install git`','Config has 3 levels: `--system`, `--global` (per user), `--local` (per repo)','Set a default editor and default branch name once, globally']],['Try it now',['Open your terminal','Run `git --version` to confirm install','Set your name and email with `--global`',"Create a GitHub account if you don't have one",'Run `git config --list` to review your settings']]]},
{k:'svg',d:'vcs'},
{k:'quiz',q:'Why is Git called a distributed VCS?',o:['It needs one central server','Every clone holds the full history','It only works online'],a:1,e:'Every clone is a complete copy, so your laptop is also a full backup.'},{k:'code',s:'$ git config --global user.name "Ada Lovelace"\n$ git config --global user.email "ada@example.com"\n$ git config --global core.editor "code --wait"\n$ git config --global init.defaultBranch main\n$ git config --global alias.co checkout\n$ git config --global alias.st status\n\n# inspect config\n$ git config --list --show-origin'},
{k:'lab',n:0,t:'Setup & First Config',st:['Run `git --version` to confirm Git is installed','`git config --global user.name "Your Name"`','`git config --global user.email "you@example.com"`','`git config --global init.defaultBranch main`','Add a shortcut: `git config --global alias.st status`','Run `git config --list` and find your settings','Sign in to your GitHub account in the browser'],tip:'Use the same email as your GitHub account so your commits show up on your profile.'}]},
{id:'m2',n:'2',t:'Git Basics',at:'0:15',s:'Learn the core daily workflow every developer uses: tracking, staging, and committing changes.',b:[
{k:'cards',h:'The Three Trees of Git',p:'Every Git operation moves changes between three areas on your machine.',c:[C('1 · Working Directory','Files you edit on disk right now.'),C('2 · Staging Area (Index)','A snapshot of changes queued for the next commit.'),C('3 · Repository (.git)','Permanent, committed history — the object database.')]},
{k:'svg',d:'trees'},{k:'svg',d:'life'},

{k:'cmds',h:'Starting a Repository',c:[['git init','Turn the current folder into a new Git repository (creates .git/)'],['git clone <url>','Copy an existing remote repository, including full history'],['git add <file>',"Stage a file's changes for the next commit"],['git add .','Stage every changed file in the current directory'],['git commit -m "msg"','Save staged changes as a new snapshot with a message'],['git commit -am "msg"','Stage all tracked, modified files AND commit in one step']]},

{k:'code',s:'$ git log --oneline --graph --all\n* 7a3f1c9 (HEAD -> main) Add login form\n* 4b8e220 Fix navbar spacing\n* 9cd1a04 Initial commit\n\n$ git diff\ndiff --git a/app.js b/app.js\n-const port = 3000;\n+const port = 4000;\n\n$ git status\nOn branch main\nChanges not staged for commit:\n  modified:   app.js'},
{k:'two',h:'.gitignore & Undoing Changes',c:[['.gitignore',['Tells Git which files/folders to never track — dependencies, secrets, build output, OS files.']],['Undoing things safely',['`git restore <file>` — discard uncommitted changes in working dir','`git restore --staged <f>` — unstage a file (keep the edits)','`git commit --amend` — fix the message or add files to the last commit','`git revert <commit>` — create a new commit that undoes a past commit']]]},
{k:'code',s:'# .gitignore\nnode_modules/\n.env\n*.log\ndist/\n.DS_Store\n__pycache__/'},

{k:'lab',n:4,t:'Open Your First Pull Request',st:['On GitHub, fork a small public practice repo (or use your own)','Clone your fork locally','`git switch -c feature/update-readme`','Make a small, clear change and commit it','`git push -u origin feature/update-readme`',"On GitHub, click 'Compare & pull request'",'Write a clear title & description, then open the PR','Add a reviewer if working with a partner; discuss & merge'],tip:'A great PR description answers: what changed, why, and how to test it. Small, focused PRs get reviewed faster than huge ones.'}]},
{id:'m6',n:'6',t:'Advanced Git',at:'1:30',s:'Rewrite history, recover from mistakes, and wield Git like a senior engineer.',b:[
{k:'text',h:'Rebasing: A Cleaner History',p:"Rebase replays your commits on top of another branch's tip, instead of creating a merge commit — producing a linear history.",i:['merge: preserves true history, adds merge commits','rebase: linear history, easier to read, rewrites hashes']},
{k:'svg',d:'rebase'},
{k:'quiz',q:'You pushed a bad commit to a shared branch. What is the safest undo?',o:['git reset --hard','git revert','git rebase'],a:1,e:'revert adds a new commit that undoes the old one, so shared history is not rewritten.'},{k:'code',s:'$ git switch feature/x\n$ git rebase main\n# replays each commit from feature/x\n# one-by-one onto the tip of main\n\n$ git push --force-with-lease\n# history changed -> needs a force push\n\n# Interactive rebase for local cleanup:\n$ git rebase -i HEAD~3\npick 1a2b3c Add form\nsquash 4d5e6f Fix typo\nreword 7g8h9i Improve copy'},
{k:'note',t:'Golden rule',s:"Never rebase a branch that others have already pulled and are working on. Rebase rewrites commit hashes — it's only safe for local or personal branches."},
{k:'two',h:'Cherry-Pick & Stash',c:[['git cherry-pick',['Apply one specific commit from another branch onto your current branch, without merging everything else.','`git cherry-pick 4b8e220` — applies just that one commit','`git cherry-pick A..B` — apply a range of commits']],['git stash',['Temporarily shelve uncommitted changes so you can switch branches, then bring them back later.','`stash` save · `stash list` see all · `stash pop` reapply + remove','`stash apply` reapply, keep it · `stash drop` discard · `stash -u` include untracked']]]},
{k:'svg',d:'stash'},
{k:'cards',h:'Reset vs. Revert vs. Checkout',c:[C('git reset — use for local commits not yet pushed','Moves the branch pointer. Rewrites history. `--soft`: keep changes staged · `--mixed` (default): keep changes, unstaged · `--hard`: discard changes completely'),C('git revert — use for undoing something already pushed','Creates a NEW commit that undoes a prior one. Original stays in history; safe on pushed / shared branches.'),C('git checkout / restore — use for browsing history or restoring a file','Moves HEAD or restores files, without altering branch history. `checkout <branch>` switches; `checkout <commit> -- <file>` restores an old version; checking out a commit directly gives a detached HEAD.')]},
{k:'svg',d:'reset'},
{k:'quiz',q:'After git reset --hard you think a commit is lost. What can recover it?',o:['git reflog','git stash','git bisect'],a:0,e:'The reflog records every place HEAD has been, so you can find the hash and reset to it.'},
{k:'two',h:'The Safety Net: Reflog & Bisect',c:[['git reflog',['A local log of every place HEAD has pointed — commits, resets, checkouts, rebases. Your undo button of last resort.']],['git bisect',['Binary-searches your commit history to find exactly which commit introduced a bug.']]]},
{k:'code',s:'$ git reflog\n7a3f1c9 HEAD@{0}: commit: Add form\n4b8e220 HEAD@{1}: reset: moving to 4b8e220\n9cd1a04 HEAD@{2}: commit (initial): Init\n\n# recover a "lost" commit\n$ git reset --hard HEAD@{2}\n\n$ git bisect start\n$ git bisect bad              # current commit is broken\n$ git bisect good v1.2.0      # this old tag was fine\n# Git checks out a midpoint commit\n$ git bisect good   # or `bad`, repeat...\n# Git reports the exact culprit commit\n$ git bisect reset'},
{k:'two',h:'Tags, Releases & Submodules',c:[['Tags & Releases',['Tags mark a specific commit permanently — typically for versions','Lightweight tags: just a name pointing to a commit','Annotated tags: store author, date, message (recommended)',"GitHub 'Releases' wrap a tag with notes and binary attachments"]],['Submodules (brief)',['Embed one Git repo inside another, pinned to a commit','Useful for shared libraries across multiple projects','Notoriously fiddly — many teams prefer monorepos or package managers instead']]]},
{k:'code',s:'$ git tag -a v1.0.0 -m "First stable release"\n$ git push origin v1.0.0\n$ git tag                 # list tags\n\n$ git submodule add <url> libs/shared\n$ git clone --recurse-submodules <url>\n$ git submodule update --init --remote'},
{k:'lab',n:5,t:'Advanced Recovery Drill',st:['Make 3 small commits on a scratch branch','`git reset --hard HEAD~1` to "lose" the last commit','Use `git reflog` to find its hash and recover it','`git stash` a work-in-progress change, switch branches','`git stash pop` it back on the original branch','Cherry-pick one commit from another branch','Start `git rebase -i` to squash two commits into one'],tip:"Mistakes in Git are almost always recoverable as long as you haven't run `git gc` — the reflog typically holds 90 days of history."}]},

{k:'two',h:'Branch Protection & Ownership',c:[['Branch protection rules',['Require pull request reviews before merging','Require status checks (CI) to pass first','Require signed / verified commits','Block force-pushes and branch deletion','Require linear history (no merge commits)','Restrict who can push to protected branches']],['CODEOWNERS',['A file that automatically requests review from the right people when specific paths change.','Combine with required reviews so PRs can\'t merge without sign-off from the responsible owner.']]]},
{k:'code',s:'# .github/CODEOWNERS\n*.js        @frontend-team\n/api/       @backend-team\n/docs/      @docs-writer\n*           @project-lead'},
{k:'two',h:'GitHub CLI, Pages & Webhooks',c:[['GitHub CLI (gh)',['Manage issues, PRs, and repos from the terminal without opening a browser.']],['GitHub Pages',['Host a static site directly from a repo branch or /docs folder — free hosting.','Repo Settings → Pages','Choose branch (e.g. main) and folder (/ or /docs)','Site publishes at username.github.io/repo','Rebuilds automatically on every push']],['Webhooks',['Notify an external service (Slack, a server) whenever an event happens in the repo.']]]},
{k:'code',s:'# GitHub CLI examples\n$ gh auth login\n$ gh repo create my-project --public\n$ gh pr create --title "Add login" --body "Closes #12"\n$ gh pr list\n$ gh pr checkout 42\n$ gh issue create --title "Bug: crash on save"'},
{k:'cards',h:'Secrets & Security',c:[C('Personal Access Tokens','Replace passwords for HTTPS/API auth. Scope them narrowly and set expirations.'),C('Actions Secrets','Store API keys and credentials encrypted in repo/org settings — never hardcode them.'),C('Signed Commits (GPG/SSH)',"Cryptographically prove a commit really came from you; shows a 'Verified' badge."),C('Dependabot & Secret Scanning','GitHub auto-flags vulnerable dependencies and leaked credentials in pushes.')]},
{k:'lab',n:6,t:'Your First GitHub Action',st:['In `git-lab`, create the folder `.github/workflows/`','Add `ci.yml` with a workflow that runs `echo "Hello CI"` on push','`git add .`, then `git commit -m "Add CI workflow"`','`git push`','Open the Actions tab on GitHub and watch the run turn green','Break it on purpose (change `echo` to a bad command), push, and see it fail','Fix it and push again'],tip:'A red X is not a failure of you, it is the robot doing its job. Read the log, fix, push.'}]},

{k:'text',h:'How to Contribute: Step by Step',i:['Find a project you use, or search GitHub for `label:"good first issue"`','Read `README.md` and `CONTRIBUTING.md`','Comment on the issue: "Can I work on this?" and wait for a yes','Fork the repo and clone YOUR fork','Add the original repo as `upstream`','Create a branch, make a small focused change, commit','Push to your fork and open a pull request that says `Closes #issue`','Answer review comments politely, push fixes to the same branch','Celebrate when it is merged']},
{k:'code',s:'$ git clone git@github.com:YOU/project.git\n$ cd project\n$ git remote add upstream https://github.com/OWNER/project.git\n$ git remote -v\n\n# always work on a branch\n$ git switch -c fix/typo-in-docs\n$ git add . && git commit -m "docs: fix typo in install guide"\n$ git push -u origin fix/typo-in-docs\n\n# keep your fork up to date\n$ git fetch upstream\n$ git switch main\n$ git merge upstream/main\n$ git push origin main'},

const STORY='<section id="story"><div class="tag">Optional read · 2 minutes, or skip</div><h2>The Story of Git</h2><p class="sub">Every tool exists because someone was in pain. Read this story once and every command in this workshop will make sense.</p><div class="sw">'+SV.story+'</div><div class="chs">'+[['1','Before Git','Every developer’s nightmare','You save `project_final.zip`, then `project_final_v2.zip`, then `project_REAL_final_v3_use_this.zip`. A teammate edits the same file and one of you overwrites the other. Nobody knows who changed what, or why. This is the pain version control was invented to remove.'],['2','The central-server era','1990s – 2000s · CVS and SVN','One big server kept the history and everyone asked it for permission. Better, but if the server was down nobody could save work, and no internet meant no history. Branching was slow and scary.'],['3','April 2005: the breakup','Linux needed a new tool','The Linux kernel team used a proprietary tool called BitKeeper. When the free licence was withdrawn, thousands of developers had no tool. Linus Torvalds, the creator of Linux, wrote one himself in days with three goals: be fast, be distributed, and never silently corrupt history. He named it “git”, British slang for a grumpy person, joking that he names projects after himself.'],['4','The big idea','Snapshots + fingerprints','Git stores snapshots of your whole project and gives each one a unique fingerprint (a hash like `7a3f1c9`) calculated from its content. Change anything and the fingerprint changes, so history cannot be altered without everyone noticing. Every clone holds the full history, so your laptop is a complete backup.'],['5','2008: GitHub makes it social','Git was powerful but lonely','GitHub put Git repositories on the web and added a human layer: forks, pull requests, issues, code review and profiles. Suddenly strangers could improve each other’s code. In 2018 Microsoft acquired it, and today Actions, Pages and security tools live there too.'],['6','Your chapter','Today','Almost every software team on Earth uses Git. In the next 2 hours you go from “what is a commit?” to rebasing, recovering lost work and automating tests. Every module opens with a hook, explains the idea in plain words, then shows every command: why it exists, how to use it, and what to watch out for.']].map(c=>'<div class="ch"><div class="e">'+c[0]+'</div><div><span class="y">'+c[1]+'</span><h4>'+c[2]+'</h4><p>'+f(c[3])+'</p></div></div>').join('')+'</div></section>';
const HK={
m9:["The tool you use every day was built by strangers. Next week, one of them could be you.","Open source is Git and GitHub used at world scale. Everything in this workshop, fork, branch, commit, pull request, review, is exactly how you join a real project. You will learn what open source is, how licences work and how to send your first contribution.","Open source = a public recipe anyone can cook, improve and share back."],
m1:["It is Friday, 6 PM. You “improved” the app. Now nothing works and the last good copy is overwritten.","Every developer has lived this. Somewhere, another developer just pressed one button and rewound the whole project to Thursday. By the end of this module you will know what that button is, why the world trusts it, and how Git differs from GitHub.","Version control is an unlimited undo button plus a diary of who changed what, when and why."],
m2:["What if every time your code worked, you could take a photo of it and never lose it?","In a video game you save before the boss fight; if you die, you reload. Git commits are your save points. You will learn the daily three-step ritual every developer repeats hundreds of times: edit, stage, commit.","Working directory = your desk. Staging area = the box you put things in before taking the photo. Commit = the photo, kept forever."],
m3:["What if you could try a wild idea in a parallel universe, and delete it if it fails?","Branches let ten people build ten features at once without breaking the stable app. When a feature is ready, you merge it back. Sometimes two universes disagree, and that is called a conflict. You will fix one on purpose, so it never scares you again.","A branch is a sticky note pointing at a commit. Creating one costs almost nothing."],
m4:["Your laptop falls in a river. Your code does not.","GitHub is an off-site backup and your front door to the world: portfolios, open source, team projects. You will connect your computer to it securely and learn the difference between sending, downloading and syncing.","Local repo = your notebook. `origin` = a shared copy in the cloud. Push sends pages up, pull brings new pages down."],
m5:["How do 1,000 strangers improve one project without chaos?","The answer is not magic, it is a ritual: fork, branch, pull request, review, merge. This is exactly how open source and every professional team works, and you will open your own pull request in the lab.","A pull request says: “I made a change, please look before it joins the main story.”"],
m6:["You deleted the wrong commit. Panic? No. Git remembers everything.","Senior engineers are not people who never make mistakes; they are people who know how to undo them. Rebase, stash, cherry-pick, reset, revert, reflog and bisect are your time-travel toolkit.","If Git was a video game, the reflog is the hidden “continue from last checkpoint” screen."],
m7:["It is 3 AM. A robot just tested your code, blocked a bug and told you, while you slept.","GitHub Actions, protected branches and secret scanning turn a repo from a folder into a safety-checked delivery line. Learn how teams ship code without fear.","CI/CD = an automatic quality inspector who checks every change before it reaches customers."],
m8:["Six months from now the person confused by your commit will be you.","Great engineers are remembered for clear commit messages and calm habits. You will learn a message format that teams love, then keep a cheat sheet to take home.","A commit message is a letter to your future self. Make it kind."]};

const CX={
m9:[["git remote add upstream <url>","Links your fork to the ORIGINAL project so you can pull its latest changes.","Run once after cloning your fork, then verify with `git remote -v`.","`origin` is your fork, `upstream` is the original. Do not mix them up."],["git fetch upstream / merge upstream/main","Keeps your fork in sync so your PR does not conflict with new work.","`git fetch upstream`, `git switch main`, `git merge upstream/main`, `git push origin main`.","Always sync before starting a new branch."],["Closes #12","A keyword in the PR description that links and auto-closes an issue on merge.","Write it in the PR body with the real issue number.","Only add it if your PR fully fixes the issue."],["good first issue","A label maintainers add to beginner-friendly tasks.","Search GitHub for `label:\"good first issue\" is:open`, then comment before starting.","Do not start if someone is already assigned."]],
m1:[["git --version","Confirms Git is installed and which version you have.","Run it in any terminal; you should see `git version 2.x`.","‘command not found’ means install Git (git-scm.com) and reopen the terminal."],["git config --global user.name / user.email","Every commit is stamped with an author, so Git must know who you are.","Run each once with your own details. `--global` applies it to every repo on this computer.","Use the same email as your GitHub account so commits link to your profile."],["git config --global init.defaultBranch main","Sets the first branch name of new repos to `main`, the modern standard.","Run once, globally.","Only affects repos created after this."],["git config --list --show-origin","Audits every setting and shows which file it came from.","Read top to bottom; later lines override earlier ones.","Precedence is `--local` over `--global` over `--system`."],["git config --global alias.st status","Aliases shrink long commands so you type less.","After running it, `git st` works exactly like `git status`.","Aliases live in `~/.gitconfig`; edit that file to remove them."]],
m2:[["git init","Turns any folder into a repository by creating a hidden `.git/` folder that stores all history.","`cd` into your project, then run `git init` once.","Never run it inside another repo; you would create a repo within a repo."],["git clone <url>","Downloads an existing project with its full history so you can start working.","`git clone git@github.com:user/repo.git` creates a folder named `repo`.","Clone once; after that use `pull` to stay updated."],["git status","Your dashboard: shows what is untracked, modified and staged.","Run it before and after almost every command.","It also tells you the next command to use, so read the hints."],["git add <file> / git add .","Moves changes to the staging area, choosing what goes into the next snapshot.","`git add app.js` stages one file; `git add .` stages everything in the folder.","Check `git status` first so you do not stage secrets or junk."],["git commit -m \"msg\"","Saves the staged snapshot permanently with a message explaining why.","Stage first, then `git commit -m \"Add login form\"`. `-am` also stages tracked files.","Without `-m` an editor opens; type a message and close it."],["git log --oneline --graph --all","Shows history compactly, including branches, as a drawing.","Run it any time; press `q` to leave the pager.","Add it to an alias, you will use it constantly."],["git diff / git diff --staged","Shows exactly which lines changed: `diff` is unstaged, `--staged` is what the next commit will contain.","Run before committing to review your own work like a code reviewer.","Plain `git diff` shows nothing after `git add`; use `--staged`."],["git show <commit>","Displays what one commit changed and its message.","Use a hash from `git log`, e.g. `git show 7a3f1c9`.","Hashes can be shortened to 7 characters."],["git restore <file> / --staged","Undoes work: plain form discards edits, `--staged` unstages but keeps the edits.","`git restore app.js` or `git restore --staged app.js`.","Discarding uncommitted edits cannot be undone."],["git commit --amend","Fixes the last commit’s message or adds a forgotten file.","Stage the missing file, then `git commit --amend`.","Only amend commits you have not pushed."],[".gitignore","Keeps secrets, dependencies and build output out of history.","Create a file named `.gitignore` and list patterns like `node_modules/` and `.env`.","Files already committed stay tracked; remove them with `git rm --cached`."]],
m3:[["git branch / git branch <name>","Lists branches, or creates one without switching.","`git branch` to list; `git branch idea` to create.","The current branch has a `*` next to it."],["git switch -c <name>","Creates a branch and moves onto it: the everyday way to start new work.","`git switch -c feature/login`. Use `git switch main` to go back.","Commit or stash changes first if Git refuses to switch."],["git merge <branch>","Brings another branch’s commits into the one you are on.","Switch to the receiving branch, then `git merge feature/login`.","Merge direction matters: you are always merging into the current branch."],["Conflict markers","Appear when both branches edited the same lines, so Git asks a human to decide.","Edit the file, delete `<<<<<<<`, `=======`, `>>>>>>>`, keep the right text, `git add`, then `git commit`.","Search the file for `<<<<<<<` so you miss no conflict."],["git merge --abort","Cancels a messy merge and restores the state before it began.","Run it while the merge is in progress.","It only works before you finalize the merge commit."],["git branch -d <name>","Cleans up a branch after it is merged.","`git branch -d feature/login`.","`-d` is safe and refuses if unmerged; `-D` forces and can lose work."]],
m4:[["ssh-keygen -t ed25519","Creates a key pair so GitHub trusts your computer without passwords.","Run with your email, accept defaults, then paste `~/.ssh/id_ed25519.pub` into GitHub → Settings → SSH keys.","Never share the private key (the file without `.pub`)."],["git remote add origin <url>","Tells your local repo where its online copy lives; `origin` is the conventional name.","`git remote add origin git@github.com:user/repo.git`, verify with `git remote -v`.","‘remote origin already exists’ means use `git remote set-url origin <url>`."],["git push -u origin main","Uploads your commits and remembers the link so later a plain `git push` works.","Run it once per branch with `-u`.","If rejected, someone else pushed first; pull, then push."],["git fetch vs git pull","`fetch` only downloads so you can inspect first; `pull` is fetch plus merge.","`git fetch origin` then `git log origin/main`, or `git pull origin main`.","Fetch is always safe; pull can create merge conflicts."]],
m5:[["git clone <your fork url>","Gets your personal copy of a project onto your machine.","Fork on GitHub, copy the URL, then run clone.","Clone your fork, not the original, unless you are a collaborator."],["git switch -c feature/x","Keeps your change isolated so the pull request contains only that work.","Create it before editing files.","Never work directly on `main` in a shared project."],["git push -u origin feature/x","Publishes your branch so GitHub can offer ‘Compare & pull request’.","Run once, then open the PR in the browser.","Add ‘Closes #12’ to the description to auto-close the issue."]],
m6:[["git rebase <branch>","Replays your commits on top of another branch for a straight, tidy history.","On your feature branch run `git rebase main`.","Never rebase commits others already pulled; it rewrites hashes."],["git rebase -i HEAD~3","Cleans up your last commits: squash, reword, reorder or drop.","Change `pick` to `squash` or `reword` in the editor and save.","Do it before opening a PR, on your own branch only."],["git push --force-with-lease","Force-pushes after a rebase, but only if nobody else pushed meanwhile.","Use it instead of `--force`.","Plain `--force` can erase teammates’ work."],["git cherry-pick <commit>","Copies exactly one commit to your branch, like taking one apple from a tree.","`git cherry-pick 4b8e220` or a range `A..B`.","It creates a new commit with a new hash."],["git stash / pop","Shelves unfinished work so you can switch tasks with a clean folder.","`git stash`, switch, work, return, `git stash pop`. Add `-u` for untracked files.","`pop` deletes the stash, `apply` keeps it."],["git reset --soft / --mixed / --hard","Moves the branch back to an earlier commit. Soft keeps changes staged, mixed unstages them, hard discards them.","`git reset --hard HEAD~1` removes the last commit and its changes.","Only for local commits; `--hard` destroys uncommitted work."],["git revert <commit>","Undoes a pushed commit safely by adding a new opposite commit.","`git revert 7a3f1c9`.","Use revert on shared branches, reset on private ones."],["git reflog","A private log of everywhere HEAD has been, letting you recover ‘lost’ commits.","Find the hash, then `git reset --hard <hash>` or `git switch -c rescue <hash>`.","Entries expire, roughly 90 days by default."],["git bisect","Finds which commit broke things using binary search, in about log2(n) steps.","`bisect start`, mark `bad` and `good <tag>`, test each step, then `bisect reset`.","Have a quick test for ‘is it broken?’ ready."],["git tag -a v1.0.0 -m \"msg\"","Marks a commit permanently, usually for a release.","Then `git push origin v1.0.0`.","Tags are not pushed automatically."]],
m7:[["gh pr create","Opens a pull request from the terminal, without the browser.","`gh auth login` once, then `gh pr create --title \"Add login\" --body \"Closes #12\"`.","Push your branch first."],["on: push / pull_request","Tells a GitHub Actions workflow when to run.","Put it at the top of `.github/workflows/ci.yml`.","Wrong indentation is the most common YAML failure."],["Branch protection","Makes rules that even admins follow: reviews, passing CI, no force-push.","Repo Settings → Branches → Add rule.","Tick ‘Require status checks’ so broken code cannot merge."],["CODEOWNERS","Automatically asks the right people to review changes in their area.","Create `.github/CODEOWNERS` with path and @team pairs.","The last matching pattern wins."],["Actions secrets","Keeps API keys out of code.","Settings → Secrets, then use `${{ secrets.NAME }}` in workflows.","A pushed secret is compromised; rotate it, do not just delete it."],["git submodule add <url> <path>","Embeds another repo at a pinned commit.","Clone with `--recurse-submodules` or run `git submodule update --init`.","Fiddly; consider a package manager."]],
m8:[["git commit -m \"feat(auth): add reset flow\"","A structured message makes history searchable and can drive automatic changelogs.","Use `type(scope): summary`, imperative, under 50 chars; the body explains why.","‘fix stuff’ tells your future self nothing."],["git log --oneline","A quick review of the story your messages tell.","Read the last 10 lines: could a stranger follow them?","If not, reword with `rebase -i` before pushing."]]};
const GVG='<section id="gvg"><div class="tag">Start here · 5 minutes</div><h2>Git vs GitHub: What\'s the Difference?</h2><p class="sub">People mix these up all the time. Sort it out now and the rest of the workshop will make sense.</p><div class="sw">'+SV.gvg+'</div><div class="two">'+[['Git — the tool',['A version control TOOL that runs on your own computer.','Free, open source, created by Linus Torvalds in 2005','Tracks every change: commits, branches, history','Works fully offline, no account needed','You use it through the terminal (`git ...`)']],['GitHub — the platform',['A website that HOSTS Git repositories online.','Owned by Microsoft, launched in 2008','Cloud backup + sharing for your repos','Adds pull requests, issues, code review, Actions','Alternatives: GitLab, Bitbucket, Azure DevOps']]].map(c=>'<div class="card"><h4>'+f(c[0])+'</h4>'+ul(c[1])+'</div>').join('')+'</div><div class="card" style="margin-top:14px">'+[['Where it lives','Git: your computer · GitHub: the internet'],['Needs internet?','Git: no · GitHub: yes'],['Main job','Git: track and manage versions · GitHub: share and collaborate'],['Can exist without the other?','Git: yes · GitHub: no, it is built on Git']].map(r=>'<div class="cmd"><code>'+esc(r[0])+'</code><span>'+f(r[1])+'</span></div>').join('')+'</div><div class="note"><b>Easy analogy</b> — Git is the camera that takes snapshots of your project. GitHub is the online photo album where you store and share them with others.</div><div class="note"><b>Try it now (1 min)</b> — Open a terminal and run <code>git --version</code>, then open <code>github.com</code> and sign in. One is on your machine, one is on the web: that is the whole difference.</div>'+R.quiz({k:'quiz',q:'Which one works fully offline on your own computer?',o:['Git','GitHub','Both need internet'],a:0,e:'Git runs locally. GitHub is the online service that hosts your Git repos.'})+'</section>';
